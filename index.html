<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Maison Paris</title>
<meta name="description" content="L’hebdomadaire du mercredi et le cahier portefeuille du lundi.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maison Paris">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbf9f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<style>
@font-face{font-family:"Playfair Display";src:url("fonts/playfair-display-latin-700-normal.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Playfair Display";src:url("fonts/playfair-display-latin-900-normal.woff2") format("woff2");font-weight:900;font-style:normal;font-display:swap}
@font-face{font-family:"Playfair Display";src:url("fonts/playfair-display-latin-400-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Playfair Display";src:url("fonts/playfair-display-latin-700-italic.woff2") format("woff2");font-weight:700;font-style:italic;font-display:swap}
@font-face{font-family:"Source Serif 4";src:url("fonts/source-serif-4-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Source Serif 4";src:url("fonts/source-serif-4-latin-400-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Source Serif 4";src:url("fonts/source-serif-4-latin-600-normal.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Libre Franklin";src:url("fonts/libre-franklin-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Libre Franklin";src:url("fonts/libre-franklin-latin-600-normal.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Libre Franklin";src:url("fonts/libre-franklin-latin-800-normal.woff2") format("woff2");font-weight:800;font-style:normal;font-display:swap}

/* Kiosque : une colonne de lecture, la liste des numéros en tête, les pages du numéro choisi en dessous. Reprend l'identité du journal imprimé. */
:root{
  --paper:#fbf9f4; --ink:#151515; --muted:#6b6252; --rule:#cfc7b6; --red:#a3231f; --card:#ffffff;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Source Serif 4",Georgia,serif;
  --label:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#16140f;--ink:#ece6da;--muted:#a59b88;--rule:#3a352b;--red:#e0675f;--card:#1f1c16;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#16140f;--ink:#ece6da;--muted:#a59b88;--rule:#3a352b;--red:#e0675f;--card:#1f1c16;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);margin:0}
.wrap{max-width:1020px;margin:0 auto;padding:28px 16px 64px}
header{text-align:center;border-bottom:3px double var(--ink);padding-bottom:14px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:8px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,9vw,84px);line-height:1;margin:14px 0 6px;letter-spacing:-.01em}
.tag{font-style:italic;color:var(--muted);margin:0;font-size:16px}
h2{font-family:var(--label);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin:28px 0 10px}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ed{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start;text-align:left;background:var(--card);border:1px solid var(--rule);padding:12px;cursor:pointer;color:inherit;font:inherit}
.ed:hover{border-color:var(--ink)}
.ed:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ed[aria-current="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.ed img{width:96px;height:auto;border:1px solid var(--rule);display:block}
.ed .k{font-family:var(--label);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:700}
.ed .t{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.2;margin:4px 0 6px;text-wrap:balance}
.ed .d{font-family:var(--label);font-size:12px;color:var(--muted)}
.reader{margin-top:8px}
.rh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:10px}
.rh h3{font-family:var(--display);font-size:clamp(22px,4vw,32px);margin:0;text-wrap:balance}
.rh span{font-family:var(--label);font-size:12px;color:var(--muted)}
.pages{display:flex;flex-direction:column;gap:18px;margin-top:16px}
.pages figure{margin:0}
.pages img{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--rule);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pages figcaption{font-family:var(--label);font-size:11px;color:var(--muted);text-align:right;margin-top:4px;font-variant-numeric:tabular-nums}
.foot{margin-top:40px;border-top:1px solid var(--rule);padding-top:12px;font-family:var(--label);font-size:12px;color:var(--muted);line-height:1.5}

/* Bascule Lecture / Pages */
.modes{display:inline-flex;border:1px solid var(--ink);margin-top:12px}
.modes button{font-family:var(--label);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--ink);border:0;padding:9px 14px;cursor:pointer;min-height:40px}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.modes button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
/* Version lecture : le numéro recomposé en une colonne, taille de texte de liseuse */
.article{max-width:680px;margin:18px auto 0;font-size:18px;line-height:1.55;--tint:#f1ece1;--blue:#1f4e79}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .article{--tint:#26221b;--blue:#7fa9d6}}
:root[data-theme="dark"] .article{--tint:#26221b;--blue:#7fa9d6}
.article section{margin:0 0 34px;padding-top:22px;border-top:2px solid var(--ink)}
.article section.une{border-top:0;padding-top:0}
.article .masthead,.article .byline{display:none}
.article p{margin:0 0 .85em;text-align:left;hyphens:auto;-webkit-hyphens:auto}
.article b{font-weight:600}
.article .kicker,.article .une-kicker{font-family:var(--label);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:0 0 6px}
.article .une-title{font-family:var(--display);font-weight:900;font-size:clamp(30px,8vw,44px);line-height:1.08;margin:0 0 10px;text-wrap:balance}
.article .s-title{font-family:var(--display);font-weight:700;font-size:clamp(25px,6.6vw,34px);line-height:1.15;margin:0 0 10px;text-wrap:balance}
.article .s-title.small{font-size:24px}
.article .une-deck,.article .s-deck{font-style:italic;font-size:19px;line-height:1.45;color:var(--muted);margin:0 0 16px}
.article .a-title{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.22;margin:26px 0 8px;text-wrap:balance}
.article .a-deck{font-style:italic;color:var(--muted)}
.article .dropcap::first-letter{font-family:var(--display);font-weight:900;float:left;font-size:3.3em;line-height:.85;margin:.06em .08em 0 0}
.article blockquote.pull{margin:20px 0;padding:12px 0;border-top:3px solid var(--red);border-bottom:1px solid var(--rule);font-family:var(--display);font-style:italic;font-size:22px;line-height:1.35}
.article blockquote.pull cite{display:block;font-family:var(--label);font-style:normal;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.article .decodeur,.article .encadre{font-family:var(--label);font-size:15px;line-height:1.5;margin:18px 0;padding:12px 14px 4px}
.article .decodeur{background:var(--tint);border-top:3px solid var(--blue)}
.article .encadre{border:1px solid var(--rule)}
.article .dec-h,.article .enc-h,.article .side-h{font-family:var(--label);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.article .enc-h{color:var(--red)}
.article .side-h{font-family:var(--display);font-size:20px;letter-spacing:0;text-transform:none;color:var(--ink)}
.article .ess-grid p,.article .toc{font-family:var(--label);font-size:15.5px;line-height:1.45;border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:8px}
.article .toc-box{margin-top:20px}
.article .toc{font-size:14.5px}
.article figure{margin:18px 0 22px;background:#fff;color:#151515;padding:12px;border:1px solid var(--rule)}
.article .fig-title{font-family:var(--label);font-weight:700;font-size:15px}
.article .fig-sub{font-family:var(--label);font-size:13px;color:#6b6252;margin-bottom:8px}
.article .fig-cap{font-family:var(--label);font-size:13px;line-height:1.45;color:#5c5446;margin-top:8px}
.article .fig-cap .credit{font-style:italic}
.article svg{display:block;width:100%;height:auto}
.article .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.article table{border-collapse:collapse;font-family:var(--label);font-size:14px;line-height:1.35;min-width:560px;width:100%;font-variant-numeric:tabular-nums}
.article th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:left;border-bottom:2px solid var(--ink);padding:8px;position:sticky;top:0;background:var(--paper)}
.article td{border-bottom:1px solid var(--rule);padding:8px;vertical-align:top}
.article td:first-child{font-weight:700;position:sticky;left:0;background:var(--paper)}
.article .up{color:#2f7a45}.article .down{color:var(--red)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .article .up{color:#7cc493}}
:root[data-theme="dark"] .article .up{color:#7cc493}
.article .note,.article .disclaimer{font-family:var(--label);font-size:13px;line-height:1.5;color:var(--muted)}
.article .idea{border-top:1px solid var(--rule);padding-top:4px}
.article .howto,.article .risk{font-family:var(--label);font-size:15px}
.article .risk,.article .f-risk b{color:var(--red)}
.article .fiche{border-top:3px solid var(--rule);padding-top:12px;margin:26px 0}
.article .f-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.article .f-sect{font-family:var(--label);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.article .f-name{font-family:var(--display);font-size:26px;margin:2px 0 0}
.article .f-px{text-align:right}
.article .f-cours{display:block;font-family:var(--label);font-weight:800;font-size:22px;white-space:nowrap}
.article .f-date{font-family:var(--label);font-size:12px;color:var(--muted)}
.article .f-perf{font-family:var(--label);font-size:14px;margin:8px 0;line-height:1.6}
.article .f-range{background:#fff;border:1px solid var(--rule);padding:6px 8px;margin:8px 0}
.article .f-kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-family:var(--label);font-size:14px;margin:10px 0}
.article .f-kv span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.article .verdict{border-left:4px solid;padding:8px 12px;margin:12px 0;font-family:var(--label);font-size:15px;line-height:1.5}
.article .verdict span{display:inline-block;color:#fff;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;margin:0 8px 4px 0}
.article .f-lv,.article .f-cat,.article .f-risk{font-size:16.5px}
.article .ig-h{font-family:var(--label);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-top:3px solid;padding-top:8px;margin-top:18px}
.article .lexique p,.article .sources p{font-size:16px}
.article .sources p{font-family:var(--label);font-size:13px;color:var(--muted)}
.article h2,.article h3{letter-spacing:0;text-transform:none;color:var(--ink)}
.article h2.s-title{font-family:var(--display)}
.article tr:has(td:nth-child(4)) td:nth-child(n+2):not(:last-child){white-space:nowrap}
.article td:last-child{min-width:170px}
.article .loading{font-family:var(--label);color:var(--muted)}
@media (max-width:600px){.article{font-size:17.5px}.wrap{padding-top:18px}.ed{grid-template-columns:64px 1fr}.ed img{width:64px}.ed .t{font-size:17px}}

.status{font-family:var(--label);font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0;min-height:1.4em}
.status.off{color:var(--red)}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:max(18px,env(safe-area-inset-top))}
</style>
</head><body>
<div class="wrap">
  <header>
    <div class="top"><span>Finance · Marchés · Géopolitique</span><span>Paris</span></div>
    <h1>La Maison Paris</h1>
    <p class="tag">L’hebdomadaire du mercredi et le cahier portefeuille du lundi</p>
  </header>

  <h2>Les numéros</h2>
  <div class="list" id="list"></div>

  <p class="status" id="status" aria-live="polite"></p>
  <section class="reader" id="reader" aria-live="polite"></section>

  <p class="foot">Informations générales, pas un conseil en investissement personnalisé. Les performances passées ne préjugent pas des performances futures.</p>
</div>

<script>
let EDITIONS = [];
const src = (e,i) => e.prefix + String(i).padStart(e.pad,"0") + ".jpg";
const list = document.getElementById("list"), reader = document.getElementById("reader");

// Sur téléphone, la version lecture (texte recomposé) s'ouvre par défaut ; sur grand écran, les pages du journal.
let mode = matchMedia("(max-width: 760px)").matches ? "lecture" : "pages";
try { const m = localStorage.getItem("lmp-mode"); if (m === "lecture" || m === "pages") mode = m; } catch (_) {}
let current = null;

function show(id, scroll){
  const e = EDITIONS.find(x => x.id === id) || EDITIONS[0];
  current = e.id;
  list.querySelectorAll(".ed").forEach(b => b.setAttribute("aria-current", b.dataset.id === e.id ? "true" : "false"));
  const m = e.lecture ? mode : "pages";
  let h = `<div class="rh"><h3>${e.title}</h3><span>${e.kicker} · ${e.date} · ${e.pages} pages</span></div>`;
  if (e.lecture) h += `<div class="modes" role="group" aria-label="Affichage"><button type="button" data-m="lecture" aria-pressed="${m === "lecture"}">Lecture</button><button type="button" data-m="pages" aria-pressed="${m === "pages"}">Pages du journal</button></div>`;
  if (m === "lecture") {
    h += `<div class="article" id="article"><p class="loading">Chargement du numéro…</p></div>`;
  } else {
    h += `<div class="pages">`;
    for (let i = 1; i <= e.pages; i++) h += `<figure><img src="${src(e,i)}" alt="${e.kicker}, page ${i}" loading="${i < 3 ? "eager" : "lazy"}" width="994" height="1405"><figcaption>Page ${i} / ${e.pages}</figcaption></figure>`;
    h += "</div>";
  }
  reader.innerHTML = h;
  reader.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.m; try { localStorage.setItem("lmp-mode", mode); } catch (_) {}
    show(e.id, false);
  }));
  if (m === "lecture") {
    fetch(e.lecture).then(r => { if (!r.ok) throw 0; return r.text(); }).then(t => {
      if (current === e.id) document.getElementById("article").innerHTML = t;
    }).catch(() => {
      const a = document.getElementById("article");
      if (a) a.innerHTML = `<p class="loading">La version lecture n’a pas pu se charger. Les pages du journal restent disponibles avec le bouton ci-dessus.</p>`;
    });
  }
  if (scroll) reader.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}

function renderList(){
  list.innerHTML = "";
  EDITIONS.forEach(e => {
    const b = document.createElement("button");
    b.className = "ed"; b.dataset.id = e.id; b.type = "button";
    b.innerHTML = `<img src="${src(e,1)}" alt="" width="96" height="136"><div><div class="k">${e.kicker}</div><div class="t">${e.title}</div><div class="d">${e.date} · ${e.pages} pages</div></div>`;
    b.addEventListener("click", () => { try { history.replaceState(null, "", "#" + e.id); } catch (_) {} show(e.id, true); });
    list.appendChild(b);
  });
}
const status = document.getElementById("status");
function setStatus(){
  if (navigator.onLine) { status.className = "status"; status.textContent = "Tous les numéros sont gardés sur cet appareil pour la lecture hors connexion."; }
  else { status.className = "status off"; status.textContent = "Hors connexion : lecture des numéros déjà téléchargés."; }
}
addEventListener("online", setStatus); addEventListener("offline", setStatus);
fetch("editions.json", {cache: "no-cache"}).then(r => r.json()).then(d => {
  EDITIONS = d.editions; renderList(); show((location.hash || "").slice(1), false); setStatus();
  if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage("sync");
}).catch(() => { status.className = "status off"; status.textContent = "Impossible de charger la liste des numéros."; });
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(reg => navigator.serviceWorker.ready).then(reg => { if (reg.active) reg.active.postMessage("sync"); });
}
</script>
</body></html>
